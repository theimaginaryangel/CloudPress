[defaults]
host_key_checking = False
remote_tmp = /tmp
interpreter_python = auto_silent
timeout = 120

[ssh_connection]
retries = 5
ssh_args = -o ProxyCommand="aws ssm start-session --region us-east-1 --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=120 -o ConnectionAttempts=5
